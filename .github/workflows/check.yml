name: Validate deployment
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run lint && npm test
      - run: npm run lint --prefix web && npm run typecheck --prefix web && npm test --prefix web
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Check hosted demos without a Python service
        run: |
          npm start > /tmp/nats-next.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/demonstrator > /dev/null; then break; fi
            sleep 1
          done
          cd web
          NAT_TEST_HOSTED=1 ORBIT_BASE_URL=http://127.0.0.1:3001 npx playwright test e2e/hosted.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --frozen
        working-directory: backend
      - run: uv run ruff check src tests && uv run ruff format --check src tests && uv run mypy src && uv run pytest
        working-directory: backend
